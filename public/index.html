<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Arena Rush</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="game"></canvas>

  <div id="hud">
    <div id="leaderboard">
      <h3>Leaderboard</h3>
      <ol id="lb-list"></ol>
    </div>
    <canvas id="minimap" width="140" height="140"></canvas>
    <div id="myscore">Score: <span id="score-val">0</span></div>
  </div>

  <div id="hint">Mouse to steer • Hold SPACE to boost</div>

  <div id="start-screen">
    <div class="panel">
      <h1>⚡ ARENA RUSH</h1>
      <p>Grow by eating orbs. Crash into rivals to burst them. Don't hit anyone bigger head-on!</p>
      <input id="name-input" maxlength="16" placeholder="Enter your name" autocomplete="off" />
      <button id="play-btn">Play</button>
    </div>
  </div>

  <div id="death-screen" class="hidden">
    <div class="panel">
      <h1>You Died</h1>
      <p>Final Score: <span id="final-score">0</span></p>
      <button id="respawn-btn">Play Again</button>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="client.js"></script>
</body>
</html>
